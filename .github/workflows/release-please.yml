name: cd / release please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    environment: github-app-releaser
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.9.1

      # release-please fails when no packages are registered yet, which is the
      # case until the first package lands in packages/@trogonstack/.
      - name: Check for released packages
        id: guard
        run: mise run github:workflows:release-please:check-manifest

      - name: Google Cloud auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.RELEASER_PROJECT_ID }}
          workload_identity_provider: ${{ vars.RELEASER_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Releaser key
        id: releaser_key
        uses: google-github-actions/get-secretmanager-secrets@bc9c54b29fdffb8a47776820a7d26e77b379d262 # v3.0.0
        with:
          secrets: |-
            private_key:${{ vars.RELEASER_PRIVATE_KEY_SECRET }}

      - name: Releaser token
        id: releaser
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASER_APP_CLIENT_ID }}
          private-key: ${{ steps.releaser_key.outputs.private_key }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release please
        id: release
        if: steps.guard.outputs.configured == 'true'
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json
          token: ${{ steps.releaser.outputs.token }}

  publish:
    name: Publish
    needs: release-please
    if: needs.release-please.outputs.paths_released != '' && needs.release-please.outputs.paths_released != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        path: ${{ fromJson(needs.release-please.outputs.paths_released) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build

      - name: Publish to npm
        env:
          PACKAGE_PATH: ${{ matrix.path }}
        run: mise run github:workflows:release-please:publish
