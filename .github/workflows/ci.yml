name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        uses: ./.github/actions/build

      - name: Format check
        run: mise run github:workflows:ci:fmt-check

      - name: Lint
        run: mise run github:workflows:ci:lint

      - name: Typecheck
        run: mise run github:workflows:ci:typecheck

      - name: Test
        run: mise run github:workflows:ci:test

      - name: Docs check
        run: mise run github:workflows:ci:docs-check
